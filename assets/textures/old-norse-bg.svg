<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600">
  <defs>
    <!-- Stone base -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0.6 0 0 0 0
                                           0 0.6 0 0 0
                                           0 0 0.6 0 0
                                           0 0 0 1 0"/>
    </filter>

    <!-- Rune pattern -->
    <pattern id="runes" width="120" height="120" patternUnits="userSpaceOnUse">
      <text x="20" y="40" font-size="32" fill="rgba(255,255,255,0.06)" font-family="Noto Serif Runic">ᚠ</text>
      <text x="70" y="90" font-size="28" fill="rgba(255,255,255,0.05)" font-family="Noto Serif Runic">ᚱ</text>
      <text x="40" y="110" font-size="30" fill="rgba(255,255,255,0.04)" font-family="Noto Serif Runic">ᚦ</text>
      <text x="90" y="50" font-size="26" fill="rgba(255,255,255,0.05)" font-family="Noto Serif Runic">ᚨ</text>
    </pattern>
  </defs>

  <!-- Stone texture -->
  <rect width="100%" height="100%" filter="url(#noise)" opacity="0.9"/>

  <!-- Rune overlay -->
  <rect width="100%" height="100%" fill="url(#runes)" opacity="0.25"/>
</svg>